<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>禾禾小冒险</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div id="login-screen">
<div class="login-box">
<h1><img src="/assets/logo.png" style="height:46px;vertical-align:middle;margin-right:10px" alt="禾禾小冒险">禾禾小冒险</h1>
<p class="subtitle">多人联机文字冒险游戏</p>
<input id="login-user" placeholder="用户名" autocomplete="username">
<input id="login-email" type="email" placeholder="邮箱（注册必填）" style="display:none" autocomplete="email">
<input id="login-pass" type="password" placeholder="密码" autocomplete="current-password">
<button class="btn btn-primary" id="login-btn" onclick="doLogin()">登录</button>
<p class="toggle" onclick="toggleMode()">没有账号？<span>立即注册</span></p>
<div id="verify-box" style="display:none;margin-top:12px">
<p style="font-size:14px;color:#b8860b" id="verify-msg">📧 验证码已发送到你的邮箱，请查收</p>
<input id="verify-code" placeholder="输入6位验证码" maxlength="6" style="width:100%">
<button class="btn btn-green btn-sm" onclick="doVerify()">✅ 验证</button>
<button class="btn btn-outline btn-sm" onclick="doResendCode()">🔄 重发</button>
</div>
</div></div>

<div id="app" style="display:none">
<div id="sidebar">
<div class="logo"><button id="hamburger" onclick="toggleSidebar()" aria-label="菜单">☰</button><img src="/assets/logo.png" style="height:34px;vertical-align:middle;margin-right:8px" alt="禾禾小冒险">禾禾小冒险</div>
<nav id="nav" aria-label="游戏导航"></nav>
<div class="online-bar">🟢 在线:<span id="ol">0</span>人 | <span id="weather-display">☀️晴天 🌅早上</span></div>
</div>

<div id="main">
<div id="topbar">
<span>💰<b id="tc">0</b></span>
<span>⭐<b id="tl">Lv.1</b></span>
<span>⚡<b id="tp">0</b></span>
<span>📖<b id="ts">0 SP</b></span>
<span style="display:inline-flex;align-items:center;gap:4px">
<span style="font-size:13px">❤️</span>
<div style="width:60px;height:10px;background:#3a3a3a;border-radius:5px;overflow:hidden;border:1px solid #555">
<div id="hp-bar" style="width:100%;height:100%;background:#4caf50;border-radius:5px;transition:width .3s"></div>
</div>
<span id="hp-text" style="font-size:11px;color:#aaa">100%</span>
</span>
<span style="flex:1"></span>
<span id="tu" style="color:var(--text2)"></span>
<button class="btn btn-outline btn-sm" onclick="doLogout()">退出</button>
</div>
<div id="content"></div>
</div>
</div>

<div id="toast-container"></div>

<div id="chat-widget" class="chat-minimized" style="display:none">
<div id="chat-header" onclick="toggleChat()">💬 <span id="chat-latest">世界聊天</span></div>
<div id="chat-body">
<div id="chat-msgs"></div>
<input id="chat-input" placeholder="说点什么... 输入@提及好友" maxlength="200" onkeydown="onChatInput(event)">
</div>
</div>

<script src="/js/app.js"></script>
<script src="/js/friends.js"></script>
</body>
</html>
